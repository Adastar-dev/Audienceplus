# Configuration commune aux 4 services Jitsi (domaines XMPP internes).
x-jitsi-common: &jitsi-common
  TZ: Africa/Dakar
  ENABLE_AUTH: 1
  AUTH_TYPE: jwt
  ENABLE_GUESTS: 0
  XMPP_DOMAIN: meet.jitsi
  XMPP_AUTH_DOMAIN: auth.meet.jitsi
  XMPP_MUC_DOMAIN: muc.meet.jitsi
  XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
  XMPP_GUEST_DOMAIN: guest.meet.jitsi
  XMPP_SERVER: xmpp.meet.jitsi
  XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
  JVB_BREWERY_MUC: jvbbrewery
  JICOFO_AUTH_USER: focus
  JVB_AUTH_USER: jvb

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: audiences_judiciaires
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306" # 3307 côté machine hôte pour ne pas entrer en conflit avec un MySQL déjà installé localement
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./audiences-judiciaires-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: audiences_judiciaires
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      # Doit correspondre a la config des services jitsi-* ci-dessous.
      JITSI_DOMAIN: localhost:${JITSI_HTTPS_PORT:-8443}
      JITSI_APP_ID: ${JITSI_APP_ID:-audiences_judiciaires}
      JITSI_APP_SECRET: ${JITSI_JWT_SECRET:-dev-secret-a-changer-en-production}
    volumes:
      - ./audiences-judiciaires-backend:/var/www/html
      - backend_vendor:/var/www/html/vendor

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ./audiences-judiciaires-backend:/var/www/html
      - ./audiences-judiciaires-backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./audiences-judiciaires-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./audiences-judiciaires-frontend:/app
      - frontend_node_modules:/app/node_modules

  # Interface web pour inspecter la base de données pendant les démos/tests.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"

  # --- Visioconference : Jitsi auto-heberge (images officielles docker-jitsi-meet) ---
  # Authentification JWT : impossible d'entrer sans jeton signe par Laravel
  # (GET /api/audiences/{id}/jitsi-jeton). Le role de moderateur vient
  # uniquement du jeton (context.user.moderator, module token_affiliation) et
  # plus de l'ordre d'arrivee (ENABLE_AUTO_OWNER=0) : seul le juge est hote.
  #
  # En local, le certificat HTTPS est auto-signe : ouvrir une fois
  # https://localhost:8443 dans le navigateur et accepter l'avertissement,
  # sinon l'iframe Jitsi reste vide.
  jitsi-web:
    image: jitsi/web:${JITSI_IMAGE_VERSION:-stable}
    restart: unless-stopped
    ports:
      - "${JITSI_HTTPS_PORT:-8443}:443"
    environment:
      <<: *jitsi-common
      PUBLIC_URL: https://localhost:${JITSI_HTTPS_PORT:-8443}
      ENABLE_PREJOIN_PAGE: 0
      DISABLE_HTTPS: 0
      ENABLE_HTTP_REDIRECT: 0
    networks:
      default:
        aliases:
          - meet.jitsi

  jitsi-prosody:
    image: jitsi/prosody:${JITSI_IMAGE_VERSION:-stable}
    restart: unless-stopped
    expose:
      - "5222"
      - "5280"
      - "5347"
    environment:
      <<: *jitsi-common
      JWT_APP_ID: ${JITSI_APP_ID:-audiences_judiciaires}
      JWT_APP_SECRET: ${JITSI_JWT_SECRET:-dev-secret-a-changer-en-production}
      JWT_ACCEPTED_ISSUERS: ${JITSI_APP_ID:-audiences_judiciaires}
      JWT_ACCEPTED_AUDIENCES: jitsi
      JWT_ALLOW_EMPTY: 0
      XMPP_MUC_MODULES: token_affiliation
      ENABLE_LOBBY: 1
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_PASSWORD:-jicofo-dev-password}
      JVB_AUTH_PASSWORD: ${JITSI_JVB_PASSWORD:-jvb-dev-password}
    networks:
      default:
        aliases:
          - xmpp.meet.jitsi

  jitsi-jicofo:
    image: jitsi/jicofo:${JITSI_IMAGE_VERSION:-stable}
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    environment:
      <<: *jitsi-common
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_PASSWORD:-jicofo-dev-password}
      # Le premier arrive ne devient PAS moderateur : seul le jeton compte.
      ENABLE_AUTO_OWNER: 0

  jitsi-jvb:
    image: jitsi/jvb:${JITSI_IMAGE_VERSION:-stable}
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    ports:
      - "10000:10000/udp"
    environment:
      <<: *jitsi-common
      JVB_AUTH_PASSWORD: ${JITSI_JVB_PASSWORD:-jvb-dev-password}
      # IP a laquelle les navigateurs envoient l'audio/video. 127.0.0.1 suffit
      # pour tester sur la meme machine ; mettre l'IP LAN/publique sinon.
      JVB_ADVERTISE_IPS: ${JITSI_ADVERTISE_IP:-127.0.0.1}
      PUBLIC_URL: https://localhost:${JITSI_HTTPS_PORT:-8443}
    networks:
      default:
        aliases:
          - jvb

volumes:
  db_data:
  backend_vendor:
  frontend_node_modules:

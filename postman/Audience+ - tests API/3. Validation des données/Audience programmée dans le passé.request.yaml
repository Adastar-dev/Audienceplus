$kind: http-request
description: ""
url: "{{base_url}}/audiences"
method: POST
headers:
  Accept: application/json
  Authorization: Bearer {{token_greffier}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id_dossier": "{{id_dossier_etranger}}",
      "date_heure": "2020-01-01 09:00:00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Données invalides refusées (422)", () => pm.response.to.have.status(422));
      pm.test("L'erreur porte sur la date", () => pm.expect(pm.response.json().errors).to.have.property("date_heure"));
    language: text/javascript
order: 1000
